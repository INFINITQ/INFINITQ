<svg xmlns="http://www.w3.org/2000/svg" width="840" height="40" viewBox="0 0 840 40" role="img" aria-labelledby="title desc"><title id="title">Finish line</title><desc id="desc">Thanks for stopping by.</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.n{font-variant-numeric:tabular-nums}.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}.draw{animation:draw 2.6s cubic-bezier(.3,.7,.2,1) both}.fade{animation:fade 1s ease-out both}.blink{animation:blink 2.4s ease-in-out infinite}.still{display:none}@keyframes grow{from{transform:scaleX(0)}}@keyframes rise{from{transform:scaleY(0)}}@keyframes draw{from{stroke-dashoffset:1}}@keyframes fade{from{opacity:0}}@keyframes blink{50%{opacity:.2}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.moving{display:none}.still{display:inline}}</style><text x="0" y="25" class="s" font-size="13" fill="#59636E">Thanks for stopping by.</text><line x1="147.96" y1="20.5" x2="788" y2="20.5" stroke="#D1D9E0"/><rect x="764" y="19.5" width="24" height="2" fill="#E10600"/><rect x="800" y="16.5" width="4" height="4" fill="#1F2328"/><rect x="808" y="16.5" width="4" height="4" fill="#1F2328"/><rect x="816" y="16.5" width="4" height="4" fill="#1F2328"/><rect x="824" y="16.5" width="4" height="4" fill="#1F2328"/><rect x="832" y="16.5" width="4" height="4" fill="#1F2328"/><rect x="804" y="20.5" width="4" height="4" fill="#1F2328"/><rect x="812" y="20.5" width="4" height="4" fill="#1F2328"/><rect x="820" y="20.5" width="4" height="4" fill="#1F2328"/><rect x="828" y="20.5" width="4" height="4" fill="#1F2328"/><rect x="836" y="20.5" width="4" height="4" fill="#1F2328"/></svg>
