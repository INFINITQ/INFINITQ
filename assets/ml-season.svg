<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="538" viewBox="0 0 1000 538" role="img" aria-labelledby="title desc"><title id="title">2026 applied-ML season: 170+ challenges</title><desc id="desc">Computer vision: 35; Biology &amp; medical: 25; NLP &amp; LLMs: 22; Geospatial &amp; remote sensing: 22; OCR &amp; documents: 12; Time series &amp; tabular: 11; Physical sciences: 10; Audio &amp; speech: 9. Compute: Google Cloud, RunPod, Modal, Kaggle. Tools: PyTorch, timm, HF Transformers, LoRA, U-Net, LightGBM.</desc><style>.d{font-family:'Titillium Web','Arial Narrow','Roboto Condensed','Segoe UI',Arial,sans-serif;font-style:italic;font-weight:800}.s{font-family:'Segoe UI','Helvetica Neue',Roboto,Arial,sans-serif}.m{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace}.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}.slide{animation:slide .7s cubic-bezier(.2,.8,.2,1) both}.fade{animation:fade .8s ease-out both}.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .9s cubic-bezier(.2,.8,.2,1) both}.draw{animation:draw 2.4s cubic-bezier(.3,.7,.2,1) both}.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes slide{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes gy{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><pattern id="cf" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#0B0B0D"/><rect width="3" height="3" fill="#111114"/><rect x="3" y