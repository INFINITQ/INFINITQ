<svg xmlns="http://www.w3.org/2000/svg" width="840" height="382" viewBox="0 0 840 382" role="img" aria-labelledby="title desc"><title id="title">2026 applied-ML season: 170+ challenges</title><desc id="desc">Computer vision: 35; Biology &amp; medical: 25; NLP &amp; LLMs: 22; Geospatial &amp; remote sensing: 22; OCR &amp; documents: 12; Time series &amp; tabular: 11; Physical sciences: 10; Audio &amp; speech: 9. Compute: Google Cloud, RunPod, Modal, Kaggle. Tools: PyTorch, timm, HF Transformers, LoRA, U-Net, LightGBM.</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.n{font-variant-numeric:tabular-nums}.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}.draw{animation:draw 2.6s cubic-bezier(.3,.7,.2,1) both}.fade{animation:fade 1s ease-out both}.blink{animation:blink 2.4s ease-in-out infinite}.still{display:none}@keyframes grow{from{transform:scaleX(0)}}@keyframes rise{from{transform:scaleY(0)}}@keyframes draw{from{stroke-dashoffset:1}}@keyframes fade{from{opacity:0}}@keyframes blink{50%{opacity:.2}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.moving{display:none}.still{display:inline}}</style><rect x="0" y="13" width="14" height="2" fill="#E10600"/><text x="22" y="18" class="m" font-size="10.5" fill="#59636E" letter-spacing="1.4">SEASON 2026</text><text x="840" y="18" class="m" font-size="10.5" fill="#818B98" text-anchor="end" letter-spacing="1.4">SEP–OCT 2026 · COUNTED BY MAIN DOMAIN</text><text x="-2" y="90" class="s n" font-size="46" fill="#1F2328" font-weight="300" letter-spacing="-1">170+</text><text x="133.6" y="70" class="s" font-size="16" fill="#1F2328" font-weight="600">applied-ML challenges</text><text x="133.6" y="90" class="s"