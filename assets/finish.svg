<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-labelledby="title desc"><title id="title">Chequered flag</title><desc id="desc">Thanks for stopping by the pit wall. Cards refresh daily via GitHub Actions.</desc><style>.d{font-family:'Titillium Web','Arial Narrow','Roboto Condensed','Segoe UI',Arial,sans-serif;font-style:italic;font-weight:800}.s{font-family:'Segoe UI','Helvetica Neue',Roboto,Arial,sans-serif}.m{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace}.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}.slide{animation:slide .7s cubic-bezier(.2,.8,.2,1) both}.fade{animation:fade .8s ease-out both}.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .9s cubic-bezier(.2,.8,.2,1) both}.draw{animation:draw 2.4s cubic-bezier(.3,.7,.2,1) both}.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes slide{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes gy{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes fl0{0%,100%{transform:translateY(-0.60px)}50%{transform:translateY(0.60px)}}@keyframes fl1{0%,100%{transform:translateY(-1.15px)}50%{transform:translateY(1.15px)}}@keyframes fl2{0%,100%{transform:translateY(-1.70px)}50%{transform:translateY(1.70px)}}@keyframes fl3{0%,100%{transform:translateY(-2.25px)}50%{transform:translateY(2.25px)}}@keyframes fl4{0%,100%{transform:translateY(-2.80px)}50%{transform:translateY(2.80px)}}@keyframes fl5{0%,100%{transform:translateY(-3.35px)}50%{transform:translateY(3.35px)}}@keyframes fl6{0%,100%{transform:translateY(-3.90px)}50%{transform:translateY(3.90px)}}@keyframes fl7{0%,100%{transform:translateY(-4.45px)}50%{transform:translateY(4.45px)}}@keyframes fl8{0%,100%{transform:translateY(-5.00px)}50%{transform:translateY(5.00px)}}@keyframes fl9{0%,100%{transform:translateY(-5.55px)}50%{transform:translateY(5.55px)}}</style><defs><pattern id="cf" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#0B0B0D"/><rect width="3" height="3" fill="#111114"/><rect x="3" y="3" width="3" height="3" fill="#111114"/><rect width="3" height="1" fill="#16161A"/><rect x="3" y="3" width="1" height="3" fill="#16161A"/></pattern><linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".06"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="card"><rect width="1000" height="150" rx="16"/></clipPath></defs><rect x=".5" y=".5" width="999" height="149" rx="16" fill="url(#cf)"/><rect x=".5" y=".5" width="999" height="149" rx="16" fill="url(#sheen)" stroke="#2A2A2E"/><rect x="52" y="22" width="5" height="112" rx="2" fill="#C9C9CF"/><circle cx="54.5" cy="21" r="4.5" fill="#E4E4E7"/><g style="animation:fl0 1.3s ease-in-out -0.00s infinite"><rect x="62" y="30" width="14" height="14" fill="#F5F5F5"/><rect x="62" y="44" width="14" height="14" fill="#0A0A0A"/><rect x="62" y="58" width="14" height="14" fill="#F5F5F5"/><rect x="62" y="72" width="14" height="14" fill="#0A0A0A"/><rect x="62" y="86" width="14" height="14" fill="#F5F5F5"/><rect x="62" y="100" width="14" height="14" fill="#0A0A0A"/></g><g style="animation:fl1 1.3s ease-in-out -0.11s infinite"><rect x="76" y="30" width="14" height="14" fill="#0A0A0A"/><rect x="76" y="44" width="14" height="14" fill="#F5F5F5"/><rect x="76" y="58" width="14" height="14" fill="#0A0A0A"/><rect x="76" y="72" width="14" height="14" fill="#F5F5F5"/><rect x="76" y="86" width="14" height="14" fill="#0A0A0A"/><rect x="76" y="100" width="14" height="14" fill="#F5F5F5"/></g><g style="animation:fl2 1.3s ease-in-out -0.22s infinite"><rect x="90" y="30" width="14" height="14" fill="#F5F5F5"/><rect x="90" y="44" width="14" height="14" fill="#0A0A0A"/><rect x="90" y="58" width="14" height="14" fill="#F5F5F5"/><rect x="90" y="72" width="14" height="14" fill="#0A0A0A"/><rect x="90" y="86" width="14" height="14" fill="#F5F5F5"/><rect x="90" y="100" width="14" height="14" fill="#0A0A0A"/></g><g style="animation:fl3 1.3s ease-in-out -0.33s infinite"><rect x="104" y="30" width="14" height="14" fill="#0A0A0A"/><rect x="104" y="44" width="14" height="14" fill="#F5F5F5"/><rect x="104" y="58" width="14" height="14" fill="#0A0A0A"/><rect x="104" y="72" width="14" height="14" fill="#F5F5F5"/><rect x="104" y="86" width="14" height="14" fill="#0A0A0A"/><rect x="104" y="100" width="14" height="14" fill="#F5F5F5"/></g><g style="animation:fl4 1.3s ease-in-out -0.44s infinite"><rect x="118" y="30" width="14" height="14" fill="#F5F5F5"/><rect x="118" y="44" width="14" height="14" fill="#0A0A0A"/><rect x="118" y="58" width="14" height="14" fill="#F5F5F5"/><rect x="118" y="72" width="14" height="14" fill="#0A0A0A"/><rect x="118" y="86" width="14" height="14" fill="#F5F5F5"/><rect x="118" y="100" width="14" height="14" fill="#0A0A0A"/></g><g style="animation:fl5 1.3s ease-in-out -0.55s infinite"><rect x="132" y="30" width="14" height="14" fill="#0A0A0A"/><rect x="132" y="44" width="14" height="14" fill="#F5F5F5"/><rect x="132" y="58" width="14" height="14" fill="#0A0A0A"/><rect x="132" y="72" width="14" height="14" fill="#F5F5F5"/><rect x="132" y="86" width="14" height="14" fill="#0A0A0A"/><rect x="132" y="100" width="14" height="14" fill="#F5F