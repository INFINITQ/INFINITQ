name: Pit wall

# Rebuilds the live profile cards and the contribution snake, then publishes
# them to the `output` branch, which README.md reads its images from.
on:
  schedule:
    - cron: "23 19 * * *"  # daily at 00:53 IST; off the hour, when Actions is less busy
  workflow_dispatch:
  push:
    branches: [main, "feat/**"]
    paths:
      - "profile.config.json"
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: pit-wall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Test the card generator
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: Build the live cards
        run: python3 scripts/build_cards.py live --out dist
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Draw the contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b  # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#0A0A0A&color_dots=#EBEDF0,#FFD2CC,#FF9A8C,#F0402F,#C70500
            dist/snake-dark.svg?palette=github-dark&color_snake=#F5F5F5&color_dots=#161B22,#4C0A08,#8A0F0A,#C51208,#FF2A1A

      # One orphan commit, force-pushed: the branch never grows. Feature branches
      # only do a dry run, so main is the one place that publishes.
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4  # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
          dry_run: ${{ github.ref != 'refs/heads/main' }}
          commit_message: Update profile cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
