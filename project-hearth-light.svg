<svg xmlns="http://www.w3.org/2000/svg" width="412" height="206" viewBox="0 0 412 206" role="img" aria-labelledby="title desc"><title id="title">Hearth: Local LLM chat and coding agent on your own GPU</title><desc id="desc">Built with Rust, Tauri 2, llama.cpp, MCP. 55–87 tok/s, gpt-oss-20b (RTX 5070); 39–44 tok/s, Qwen3.6 35B (RTX 5070); 16 s agent coding task (gpt-oss-20b).</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.n{font-variant-numeric:tabular-nums}.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}.draw{animation:draw 2.6s cubic-bezier(.3,.7,.2,1) both}.fade{animation:fade 1s ease-out both}.blink{animation:blink 2.4s ease-in-out infinite}.still{display:none}@keyframes grow{from{transform:scaleX(0)}}@keyframes rise{from{transform:scaleY(0)}}@keyframes draw{from{stroke-dashoffset:1}}@keyframes fade{from{opacity:0}}@keyframes blink{50%{opacity:.2}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.moving{display:none}.still{display:inline}}</style><rect x=".5" y=".5" width="411" height="205" rx="6" fill="none" stroke="#D1D9E0"/><text x="392" y="38" class="s" font-size="12" fill="#818B98" text-anchor="end">updated 2 days ago</text><circle class="blink" cx="274.08" cy="34" r="3" fill="#E10600"/><text x="20" y="38" class="s" font-size="18" fill="#1F2328" font-weight="600">Hearth</text><text x="20" y="60" class="s" font-size="13" fill="#59636E">Local LLM chat and coding agent on your own GPU</text><line x1="20" y1="78.5" x2="392" y2="78.5" stroke="#D1D9E0"/><text x="20" y="104" class="m" font-size="10.5" fill="#818B98" letter-spacing="1.4">S1</text><text x="50" y="104" class="s n" font-size="14" fill="#1F2328" font-weight="600">55–87</text