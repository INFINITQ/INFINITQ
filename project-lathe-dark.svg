<svg xmlns="http://www.w3.org/2000/svg" width="412" height="206" viewBox="0 0 412 206" role="img" aria-labelledby="title desc"><title id="title">Lathe: Native code editor for Windows 11, no VS Code inside</title><desc id="desc">Built with Rust, Tauri 2, React 19, CodeMirror 6. 481 ms start to first paint (was 593 ms); 5 ms quick-open, 20k files (was 33 ms); 153 ms open a 10 MB file (was 181 ms).</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.n{font-variant-numeric:tabular-nums}.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}.draw{animation:draw 2.6s cubic-bezier(.3,.7,.2,1) both}.fade{animation:fade 1s ease-out both}.blink{animation:blink 2.4s ease-in-out infinite}.still{display:none}@keyframes grow{from{transform:scaleX(0)}}@keyframes rise{from{transform:scaleY(0)}}@keyframes draw{from{stroke-dashoffset:1}}@keyframes fade{from{opacity:0}}@keyframes blink{50%{opacity:.2}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.moving{display:none}.still{display:inline}}</style><rect x=".5" y=".5" width="411" height="205" rx="6" fill="none" stroke="#3D444D"/><text x="392" y="38" class="s" font-size="12" fill="#6E7681" text-anchor="end">updated yesterday</text><circle class="blink" cx="282.24" cy="34" r="3" fill="#FF2A1A"/><text x="20" y="38" class="s" font-size="18" fill="#F0F6FC" font-weight="600">Lathe</text><text x="20" y="60" class="s" font-size="13" fill="#9198A1">Native code editor for Windows 11, no VS Code inside</text><line x1="20" y1="78.5" x2="392" y2="78.5" stroke="#3D444D"/><text x="20" y="104" class="m" font-size="10.5" fill="#6E7681" letter-spacing="1.4">S1</text><text x="50" y="104" class="s n" font-size="14" fill="#F0F6FC" font-weight="600">481 ms</text><text x="128" y="104" class="s" font-size="13" fill="#9198A1">start to first paint</text><text x="392" y="104" class="m" font-size="10.5" fill="#6E7681" text-anchor="end">was 593 ms</text><text x="20" y="129" class="m" font-size="10.5" fill="#6E7681" letter-spacing="1.4">S2</text><text x="50" y="129" class="s n" font-size="14" fill="#F0F6FC" font-weight="600">5 ms</text><text x="128" y="129" class="s" font-size="13" fill="#9198A1">quick-open, 20k files</text><text x="392" y="129" class="m" font-size="10.5" fill="#6E7681" text-anchor="end">was 33 ms</text><text x="20" y="154" class="m" font-size="10.5" fill="#6E7681" letter-spacing="1.4">S3</text><text x="50" y="154" class="s n" font-size="14" fill="#F0F6FC" font-weight="600">153 ms</text><text x="128" y="154" class="s" font-size="13" fill="#9198A1">open a 10 MB file</text><text x="392" y="154" class="m" font-size="10.5" fill="#6E7681" text-anchor="end">was 181 ms</text><line x1="20" y1="168.5" x2="392" y2="168.5" stroke="#3D444D"/><text x="392" y="190" class="m" font-size="10.5" fill="#6E7681" text-anchor="end">v0.1.0</text><text x="20" y="190" class="m" font-size="10.5" fill="#6E7681">Rust · Tauri 2 · React 19 · CodeMirror 6</text></svg>
